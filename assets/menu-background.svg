  </g>

  <!-- Layered turbulence supplies the fine print-like paper and paint texture. -->
  <rect width="1920" height="1080" filter="url(#paintGrain)" opacity=".39" style="mix-blend-mode:soft-light"/>
  <rect width="1920" height="1080" filter="url(#microGrain)" opacity=".12" style="mix-blend-mode:overlay"/>
</svg>
