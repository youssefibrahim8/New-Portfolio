  <g fill="#050b0e" opacity=".5">
    <circle cx="79" cy="177" r="18"/><circle cx="222" cy="98" r="11"/><circle cx="302" cy="144" r="8"/>
    <circle cx="756" cy="61" r="15"/><circle cx="830" cy="102" r="8"/><circle cx="1183" cy="91" r="12"/>
    <circle cx="1511" cy="113" r="20"/><circle cx="1699" cy="53" r="13"/><circle cx="1880" cy="219" r="17"/>
    <circle cx="47" cy="914" r="20"/><circle cx="176" cy="1002" r="12"/><circle cx="361" cy="903" r="16"/>
    <circle cx="588" cy="1039" r="11"/><circle cx="1644" cy="962" r="15"/><circle cx="1814" cy="896" r="10"/>
  </g>

  <!-- A restrained extra layer of black paint scuffs through the warm fields. -->
  <g fill="#05080a" opacity=".28" filter="url(#dryBrush)">
    <path d="M442 82l78-28 53 17-37 22 65 8-82 31-49-10-54 23-28-24 55-18z"/>
    <path d="M48 388l93-36 45 14-38 26 72-7-60 38-79 10-51 22-34-21 55-26z"/>
