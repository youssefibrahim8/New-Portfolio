      <path d="M0 695l135-82M15 731l177-90M81 1047l182-137M253 1080l198-136M1513 1015l180-127M1734 1080l186-104"/>
    </g>
    <g stroke-opacity=".42" stroke-width="3">
      <path d="M72 8l-43 101M146 0l-67 137M335 3l-65 102M728 0l-47 138M975 0l-92 180M1267 0l-74 150M1578 0l-69 183M1847 0l-34 113"/>
      <path d="M0 806l176-86M0 858l223-94M34 1005l236-112M1702 911l218-103M1585 1079l190-119"/>
