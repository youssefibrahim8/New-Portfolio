    <circle cx="123" cy="476" r="12"/><circle cx="209" cy="430" r="7"/>
    <circle cx="824" cy="1002" r="11"/><circle cx="914" cy="958" r="6"/>
    <circle cx="1744" cy="420" r="10"/><circle cx="1810" cy="372" r="7"/>
  </g>

  <!-- High-contrast black dry-brush smears in the reference's edge zones. -->
  <g fill="#000000" opacity=".78" filter="url(#dryBrush)">
    <path d="M1210 0h710v250l-48-27-31 33-54-28-43 35-49-30-39 25-44-34-51 28-43-39-56 25-43-48-52 16-29-46-56 10-26-48-65 12-17-53-61 3z"/>
    <path d="M0 748l53-31 31 17 37-45 43 28 39-54 46 28 46-50 37 39 52-20 27 45 55-5 16 53 53 4-30 53 47 33-62 23 21 45-71 2-14 64-57-22-31 62-49-31-40 49-38-48-54 31-25-55-55 11 8-59-62 2 12-55-55-4z"/>
