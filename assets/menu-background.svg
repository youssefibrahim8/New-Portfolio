<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e51a3c"/>
      <stop offset=".42" stop-color="#b80d30"/>
      <stop offset=".72" stop-color="#28151a"/>
      <stop offset="1" stop-color="#131619"/>
    </linearGradient>
    <radialGradient id="cyanTop" cx=".4" cy=".06" r=".68">
      <stop stop-color="#ff6574" stop-opacity=".94"/>
      <stop offset=".48" stop-color="#e51a3c" stop-opacity=".66"/>
      <stop offset="1" stop-color="#b80d30" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanLeft" cx=".05" cy=".77" r=".66">
      <stop stop-color="#d71835" stop-opacity=".92"/>
      <stop offset=".57" stop-color="#b80d30" stop-opacity=".7"/>
      <stop offset="1" stop-color="#32151a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="charcoal" cx=".83" cy=".05" r=".78">
      <stop stop-color="#101316" stop-opacity=".98"/>
      <stop offset=".5" stop-color="#1a1b1c" stop-opacity=".83"/>
      <stop offset="1" stop-color="#172126" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightRed" cx=".95" cy=".66" r=".58">
      <stop stop-color="#f7d64a" stop-opacity=".92"/>
      <stop offset=".45" stop-color="#d9ae18" stop-opacity=".78"/>
      <stop offset="1" stop-color="#655018" stop-opacity="0"/>
    </radialGradient>
    <filter id="paintGrain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .022" numOctaves="4" seed="18" result="rough"/>
      <feColorMatrix in="rough" type="saturate" values="0" result="gray"/>
      <feComponentTransfer>
        <feFuncR type="gamma" amplitude="1.45" exponent="1.6" offset="-.28"/>
        <feFuncG type="gamma" amplitude="1.45" exponent="1.6" offset="-.28"/>
        <feFuncB type="gamma" amplitude="1.45" exponent="1.6" offset="-.28"/>
        <feFuncA type="table" tableValues="0 .58"/>
      </feComponentTransfer>
    </filter>
    <filter id="microGrain" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".31" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="dryBrush" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".018 .065" numOctaves="3" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="32" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#cyanTop)"/>
  <rect width="1920" height="1080" fill="url(#cyanLeft)"/>
  <rect width="1920" height="1080" fill="url(#charcoal)"/>
  <rect width="1920" height="1080" fill="url(#rightRed)"/>

