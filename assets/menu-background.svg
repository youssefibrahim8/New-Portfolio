  <g filter="url(#dryBrush)" opacity=".25">
    <path fill="#ff7b88" d="M0 0h720l-46 44 38 20-66 11 34 27-92-8-21 38-69-31-32 53-42-46-59 22-23-54-68 23-7-42-71 8 22-41-74 5z"/>
